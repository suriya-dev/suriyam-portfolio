<div class="carousel"
     (mouseenter)="onMouseOver()"
     (mouseleave)="onMouseOut()">
  <div class="track" #track>
    @for (t of techs; track t.name; let i = $index) {
      <button class="tech"
              [class.featured]="t.featured"
              [class.hovered]="hovered === i"
              (mouseenter)="onEnter(i)"
              (mouseleave)="onExit()">
        <span class="badge"
              [style.--h]="t.hue"
              [style.--s]="t.sat + '%'"
              [style.--l]="t.lum + '%'"
              [innerHTML]="glyph(t.glyph)"></span>
        <span class="meta">
          <span class="name">{{ t.name }}</span>
          <span class="sub">{{ t.sub }}</span>
        </span>
      </button>
    }
  </div>
  <button class="nav-btn prev" aria-label="Previous" (click)="scroll(-240)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button class="nav-btn next" aria-label="Next" (click)="scroll(240)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>
</div>
